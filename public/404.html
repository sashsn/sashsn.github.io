<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sadman Shahriar</title>
    <script>
      // Single-Page Apps for GitHub Pages
      // Pattern by Rafael Pedicini (MIT) -- https://github.com/rafgraph/spa-github-pages
      // Redirects any unknown path to index.html with the path encoded in the query string,
      // so the SPA can restore it via history.replaceState.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
