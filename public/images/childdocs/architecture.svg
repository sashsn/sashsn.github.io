<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="ChildDocs Nursery Solutions architecture: browser client, Apache+PHP application, MySQL data, role-gated flows for parents, teachers, and admin">
  <defs>
    <pattern id="grid-cd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17202c" stroke-width="0.6"/>
    </pattern>
    <marker id="arr-cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#79c0ff"/>
    </marker>
    <style>
      .bg { fill: #0a1017; }
      .grid { fill: url(#grid-cd); }
      .title { fill: #e2ebf5; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
      .title-sub { fill: #7ca5d1; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; }
      .stage-label { fill: #7ca5d1; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; }
      .label { fill: #e2ebf5; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
      .label-sub { fill: #9fb0c4; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
      .label-dim { fill: #8a9bb0; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
      .box { fill: #10202b; stroke: #4b6a8a; stroke-width: 1.4; }
      .box-client { fill: #152635; stroke: #79c0ff; stroke-width: 1.6; }
      .box-app { fill: #16222c; stroke: #7ee787; stroke-width: 1.6; }
      .box-db { fill: #1a1a2b; stroke: #d2a8ff; stroke-width: 1.6; }
      .edge { stroke: #79c0ff; stroke-width: 1.6; fill: none; }
      .chip { fill: #0f1721; stroke: #223244; }
      .chip-text { fill: #9fb0c4; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="560"/>
  <rect class="grid" width="1000" height="560"/>

  <text class="title" x="36" y="42">CHILDDOCS NURSERY SOLUTIONS / CLASSIC LAMP</text>
  <text class="title-sub" x="36" y="60">ROLE-GATED FLOWS . PHP/MYSQL . DAILY CARE + LOCATION TRACKING</text>

  <text class="stage-label" x="160" y="102" text-anchor="middle">CLIENT</text>
  <text class="stage-label" x="500" y="102" text-anchor="middle">APPLICATION</text>
  <text class="stage-label" x="840" y="102" text-anchor="middle">DATA</text>

  <!-- Client -->
  <rect class="box-client" x="60" y="130" width="200" height="90" rx="12"/>
  <text class="label" x="76" y="158">Parent portal</text>
  <text class="label-sub" x="76" y="178">read-only view of child</text>
  <text class="label-sub" x="76" y="192">profile, daily log, sign-outs</text>
  <rect class="chip" x="76" y="198" width="70" height="18" rx="5"/>
  <text class="chip-text" x="111" y="211" text-anchor="middle">BOOTSTRAP</text>

  <rect class="box-client" x="60" y="240" width="200" height="90" rx="12"/>
  <text class="label" x="76" y="268">Teacher dashboard</text>
  <text class="label-sub" x="76" y="288">daily logs, incidents,</text>
  <text class="label-sub" x="76" y="302">meals + naps + zone check-ins</text>
  <rect class="chip" x="76" y="308" width="54" height="18" rx="5"/>
  <text class="chip-text" x="103" y="321" text-anchor="middle">JQUERY</text>

  <rect class="box-client" x="60" y="350" width="200" height="90" rx="12"/>
  <text class="label" x="76" y="378">Admin console</text>
  <text class="label-sub" x="76" y="398">staff schedule, enrolment,</text>
  <text class="label-sub" x="76" y="412">zone + bus-route setup</text>
  <rect class="chip" x="76" y="418" width="46" height="18" rx="5"/>
  <text class="chip-text" x="99" y="431" text-anchor="middle">HTML</text>

  <!-- Application -->
  <rect class="box-app" x="340" y="130" width="320" height="310" rx="12"/>
  <text class="label" x="356" y="158">Apache + PHP</text>
  <text class="label-sub" x="356" y="178">lightweight MVC routing,</text>
  <text class="label-sub" x="356" y="192">session-based auth, role</text>
  <text class="label-sub" x="356" y="206">middleware on every request</text>
  <rect class="chip" x="356" y="218" width="54" height="20" rx="5"/>
  <text class="chip-text" x="383" y="232" text-anchor="middle">PHP 7</text>
  <rect class="chip" x="416" y="218" width="66" height="20" rx="5"/>
  <text class="chip-text" x="449" y="232" text-anchor="middle">APACHE</text>

  <rect x="356" y="252" width="288" height="40" rx="8" fill="#0e1a24" stroke="#2a3c50"/>
  <text class="label-sub" x="370" y="276">AuthController -- login, role gating, parent link token</text>

  <rect x="356" y="298" width="288" height="40" rx="8" fill="#0e1a24" stroke="#2a3c50"/>
  <text class="label-sub" x="370" y="322">ChildController -- profiles, daily log entries, incidents</text>

  <rect x="356" y="344" width="288" height="40" rx="8" fill="#0e1a24" stroke="#2a3c50"/>
  <text class="label-sub" x="370" y="368">LocationController -- zones, check-in/out, bus routes</text>

  <rect x="356" y="390" width="288" height="40" rx="8" fill="#0e1a24" stroke="#2a3c50"/>
  <text class="label-sub" x="370" y="414">StaffController -- schedules, shift notes, permissions</text>

  <!-- Data -->
  <rect class="box-db" x="720" y="130" width="220" height="200" rx="12"/>
  <text class="label" x="736" y="158">MySQL 8</text>
  <text class="label-sub" x="736" y="178">normalized schema across</text>
  <text class="label-sub" x="736" y="192">children, staff, zones, logs,</text>
  <text class="label-sub" x="736" y="206">incidents, and parent links</text>
  <rect class="chip" x="736" y="218" width="50" height="20" rx="5"/>
  <text class="chip-text" x="761" y="232" text-anchor="middle">MYSQL</text>
  <rect class="chip" x="792" y="218" width="62" height="20" rx="5"/>
  <text class="chip-text" x="823" y="232" text-anchor="middle">INNODB</text>
  <text class="label-sub" x="736" y="260">constraints + FKs enforce</text>
  <text class="label-sub" x="736" y="274">that a child is only linked</text>
  <text class="label-sub" x="736" y="288">to verified parent accounts</text>
  <text class="label-sub" x="736" y="308">audit rows on every</text>
  <text class="label-sub" x="736" y="322">care-log mutation</text>

  <rect class="box-db" x="720" y="350" width="220" height="90" rx="12"/>
  <text class="label" x="736" y="378">File storage</text>
  <text class="label-sub" x="736" y="398">photos, daily report PDFs,</text>
  <text class="label-sub" x="736" y="412">incident attachments, under</text>
  <text class="label-sub" x="736" y="426">per-tenant directories</text>

  <!-- Arrows -->
  <path class="edge" d="M 260 175 L 340 200" marker-end="url(#arr-cd)"/>
  <path class="edge" d="M 260 285 L 340 285" marker-end="url(#arr-cd)"/>
  <path class="edge" d="M 260 395 L 340 370" marker-end="url(#arr-cd)"/>
  <path class="edge" d="M 660 230 L 720 210" marker-end="url(#arr-cd)"/>
  <path class="edge" d="M 660 320 L 720 260" marker-end="url(#arr-cd)"/>
  <path class="edge" d="M 660 410 L 720 390" marker-end="url(#arr-cd)"/>

  <rect x="36" y="480" width="928" height="40" rx="10" fill="#0f1721" stroke="#223244" stroke-width="1"/>
  <text class="label-dim" x="56" y="504">// web app for a small nursery. role-gated (parent / teacher / admin). prepared statements + CSRF tokens on every mutation.</text>
</svg>
